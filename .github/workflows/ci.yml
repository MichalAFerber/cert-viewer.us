name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: Headless-Chromium harness (real CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci`, not `npm install` (§15): a frozen install that matches what
      # was reviewed. This repo had no package-lock.json until this change --
      # `npm ci` fails outright without one -- so the lockfile lands here too.
      - name: Install dependencies
        run: npm ci

      # §15 gate: lint MUST run, and MUST fail when there is no lint to run.
      # Body from tgwab-standards templates/ci.yml. Deliberately NOT
      # `npm run lint --if-present`, which exits 0 when the script is absent and
      # reports a passing lint that never ran.
      #
      # READ THIS BEFORE TRUSTING THE STEP. It lints TWO files: eslint.config.js
      # and test/harness.mjs. The viewer itself is 1,031 lines of JavaScript
      # inside one inline <script> in index.html, with 9 innerHTML sinks, and
      # ESLint cannot see any of it -- `eslint index.html` answers "File ignored
      # because no matching configuration was supplied". Measured: the §15
      # interpolated-JSON hazard planted inside that inline script produced
      # nothing, and planted in test/harness.mjs also produced nothing, because
      # the rule is scoped `**/*.js` and the harness is `.mjs`.
      #
      # What DOES check the inline script is the harness step below: it drives
      # index.html under the real _headers CSP and asserts zero pageerror and
      # zero console errors, so a throw or a syntax error there fails CI. That
      # is a real gate, but it is not lint, and it would not catch the XSS
      # pattern §15 exists for.
      - name: lint
        run: |
          set -euo pipefail
          if [ -n "${LINT_OPT_OUT:-}" ]; then
            echo "::notice title=lint opted out (§15)::${LINT_OPT_OUT}"
            exit 0
          fi
          if ! node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then
            echo "::error title=no lint script (§15)::CI MUST run lint. Add a \"lint\" script (eslint .) plus templates/eslint.config.js, or declare LINT_OPT_OUT with a reason on the ci job."
            exit 1
          fi
          npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness under the deployed CSP
        run: node test/harness.mjs
