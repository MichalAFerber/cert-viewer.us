name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: Headless-Chromium harness (real CSP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci`, not `npm install` (§15): a frozen install that matches what
      # was reviewed. This repo had no package-lock.json until this change --
      # `npm ci` fails outright without one -- so the lockfile lands here too.
      - name: Install dependencies
        run: npm ci

      # §15 gate: lint MUST run, and MUST fail when there is no lint to run.
      # Body from tgwab-standards templates/ci.yml. Deliberately NOT
      # `npm run lint --if-present`, which exits 0 when the script is absent and
      # reports a passing lint that never ran.
      #
      # THIS COMMENT USED TO SAY "it lints TWO files: eslint.config.js and
      # test/harness.mjs", because until #21 (2026-09-07) the viewer was 1,031
      # lines of JavaScript inside one inline <script> in index.html, which
      # ESLint cannot reach at all. #21 extracted that inline script wholesale
      # into app.js and cert-core.js, so the rule now also reaches those two
      # real files — and DS §15: add the XSS lint fixture (tgwab-standards#125)
      # added a fifth, test/xss-lint-fixture.test.js (the fixture itself,
      # test/fixtures/xss-lint-fixture.js, stays out via eslint.config.js's own
      # ignore, by design).
      #
      # index.html now carries no inline script beyond a static JSON-LD block,
      # so the harness step below is no longer this repo's only check on
      # hand-written JavaScript — it still matters for what lint cannot see:
      # a throw or a syntax error at runtime, under the real _headers CSP.
      - name: lint
        run: |
          set -euo pipefail
          if [ -n "${LINT_OPT_OUT:-}" ]; then
            echo "::notice title=lint opted out (§15)::${LINT_OPT_OUT}"
            exit 0
          fi
          if ! node -e "process.exit((require('./package.json').scripts||{}).lint?0:1)"; then
            echo "::error title=no lint script (§15)::CI MUST run lint. Add a \"lint\" script (eslint .) plus templates/eslint.config.js, or declare LINT_OPT_OUT with a reason on the ci job."
            exit 1
          fi
          npm run lint

      # §15 fixture: proves the XSS rule above still fires and still reaches
      # the two real files (app.js, cert-core.js) named in
      # test/fixtures/xss-lint-covers.json. Not folded into the harness step
      # or the "test" npm script above -- both are Playwright-based and this
      # needs neither Chromium nor a server.
      - name: DS §15 XSS lint fixture
        run: node --test test/xss-lint-fixture.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run harness under the deployed CSP
        run: node test/harness.mjs
